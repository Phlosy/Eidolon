name: ci

on:
  push:
    # dev 是日常开发分支（main 长期停在发布线），不在这里列出来的分支只能靠 PR 触发。
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eidolon
          POSTGRES_PASSWORD: eidolon
          POSTGRES_DB: eidolon_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U eidolon -d eidolon_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # 走 requirements.lock，和开发者用同一套版本；ruff/pytest 不随手升到最新。
        run: |
          pip install -r apps/server/requirements.lock
          pip install -e apps/server --no-build-isolation --no-deps
      - name: Ruff
        run: |
          ruff check apps/server/eidolon apps/server/tests_v2 scripts
          ruff format --check apps/server/eidolon apps/server/tests_v2 scripts
          (cd apps/runner && ruff check . && ruff format --check .)
      - name: Test (PostgreSQL)
        # tests_v2 migrates the database itself and includes `alembic check` + a
        # downgrade/upgrade round trip (test_kernel_guards).
        env:
          EIDOLON_V2_DATABASE_URL: postgresql+psycopg://eidolon:eidolon@127.0.0.1:5433/eidolon_test
        run: python -m pytest tests_v2 -q
        working-directory: apps/server
      - name: API image smoke test
        # The production image migrates and serves /api/v2/health against the same PostgreSQL.
        run: |
          docker build --file deployments/docker/Dockerfile.server --tag eidolon-api:ci .
          container_name="eidolon-api-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --network host \
            --name "$container_name" \
            --env EIDOLON_V2_DATABASE_URL=postgresql+psycopg://eidolon:eidolon@127.0.0.1:5433/eidolon_test \
            --env EIDOLON_V2_API_HOST=127.0.0.1 \
            --env EIDOLON_V2_API_PORT=26881 \
            eidolon-api:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:26881/api/v2/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_name"
          exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 仓库根目录没有 package.json，v4 无从读取 packageManager 字段，
          # 不显式给版本会直接报错：No pnpm version specified。
          # 与本地开发用同一主版本号（pnpm --version）；改这里时同步改 CONTRIBUTING。
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Prettier
        run: pnpm exec prettier --check .
        working-directory: apps/web
      - name: Typecheck
        run: pnpm exec tsc --noEmit
        working-directory: apps/web
      - name: Lint
        run: pnpm exec eslint .
        working-directory: apps/web
      - name: Test
        run: pnpm exec vitest run
        working-directory: apps/web
      - name: Build
        run: pnpm build
        working-directory: apps/web
