name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e 'apps/server[dev]'
      - name: Ruff
        run: |
          ruff check apps/server/app apps/server/tests
          ruff format --check apps/server/app apps/server/tests
      - name: Test
        run: python -m pytest apps/server/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Typecheck
        run: pnpm exec tsc --noEmit
        working-directory: apps/web
      - name: Lint
        run: pnpm exec eslint .
        working-directory: apps/web
      - name: Test
        run: pnpm exec vitest run
        working-directory: apps/web
      - name: Build
        run: pnpm build
        working-directory: apps/web
