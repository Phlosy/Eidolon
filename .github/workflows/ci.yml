name: ci

on:
  push:
    # dev 是日常开发分支（main 长期停在发布线），不在这里列出来的分支只能靠 PR 触发。
    branches: [main, dev]
  pull_request:
  # 手动跑一次（改完 CI 配置想立即验证，又不想造一个空提交）
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        # 走 requirements.lock，和开发者用同一套版本；ruff/pytest 不再随手升到最新。
        run: |
          pip install -r apps/server/requirements.lock
          pip install -e apps/server --no-deps
      - name: Ruff
        run: |
          ruff check apps/server/app apps/server/tests
          ruff format --check apps/server/app apps/server/tests
      - name: Alembic model drift
        env:
          EIDOLON_DATABASE_URL: sqlite:///${{ runner.temp }}/eidolon-alembic.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
        working-directory: apps/server
      - name: Test
        run: python -m pytest apps/server/tests -q
      - name: Server image smoke test
        run: |
          docker build --file deployments/docker/Dockerfile.server --tag eidolon-server:ci .
          container_name="eidolon-server-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          trap 'docker rm --force "$container_name" >/dev/null 2>&1 || true' EXIT
          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:26881:26881 \
            --env EIDOLON_API_HOST=0.0.0.0 \
            --env EIDOLON_RUNTIME_MODE=mock \
            --env EIDOLON_UPDATE_CHECK_ENABLED=false \
            eidolon-server:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:26881/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_name"
          exit 1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 仓库根目录没有 package.json，v4 无从读取 packageManager 字段，
          # 不显式给版本会直接报错：No pnpm version specified。
          # 与本地开发用同一主版本号（pnpm --version）；改这里时同步改 CONTRIBUTING。
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - name: Prettier
        run: pnpm exec prettier --check .
        working-directory: apps/web
      - name: Typecheck
        run: pnpm exec tsc --noEmit
        working-directory: apps/web
      - name: Lint
        run: pnpm exec eslint .
        working-directory: apps/web
      - name: Test
        run: pnpm exec vitest run
        working-directory: apps/web
      - name: Build
        run: pnpm build
        working-directory: apps/web
