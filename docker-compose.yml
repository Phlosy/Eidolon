services:
  # PostgreSQL is the only database (V1). The port and credentials match
  # EIDOLON_V2_DATABASE_URL's default and scripts/devpg.sh, so `make pg-up` (this
  # service) and `scripts/devpg.sh start` (no Docker) are interchangeable.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eidolon
      POSTGRES_PASSWORD: eidolon
      POSTGRES_DB: eidolon
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - eidolon-pg:/var/lib/postgresql/data
      - ./deployments/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eidolon -d eidolon"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - eidolon-internal

  # eidolon-api: migrates, then serves /api/v2. Internal to the compose network; only
  # the web tier is published.
  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.server
    expose:
      - "26881"
    environment:
      EIDOLON_V2_DATABASE_URL: postgresql+psycopg://eidolon:eidolon@postgres:5432/eidolon
      EIDOLON_V2_TRANSCRIPT_DIR: /data/transcripts
      EIDOLON_V2_WORKSPACE_ROOT: /data/workspaces
      EIDOLON_V2_COOKIE_SECURE: "false"
    env_file:
      - path: .env
        required: false
    volumes:
      - eidolon-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - eidolon-internal

  # eidolon-worker: the scheduler + agent loop; the only process holding provider keys.
  worker:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.server
    command: ["python", "-m", "eidolon", "worker"]
    expose:
      - "26890"
    environment:
      EIDOLON_V2_DATABASE_URL: postgresql+psycopg://eidolon:eidolon@postgres:5432/eidolon
      EIDOLON_V2_METRICS_PORT: "26890"
      EIDOLON_V2_TRANSCRIPT_DIR: /data/transcripts
      EIDOLON_V2_WORKSPACE_ROOT: /data/workspaces
    env_file:
      - path: .env
        required: false
    volumes:
      - eidolon-data:/data
    depends_on:
      api:
        condition: service_started
    networks:
      - eidolon-internal

  web:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.web
    ports:
      - "26880:26880"
    depends_on:
      - api
    networks:
      - eidolon-internal

networks:
  eidolon-internal:
    driver: bridge

volumes:
  eidolon-data:
  eidolon-pg:
