services:
  # Eidolon v2 (apps/server/eidolon) runs on PostgreSQL only. The port and credentials
  # match EIDOLON_V2_DATABASE_URL's default and scripts/devpg.sh, so `make pg-up`
  # (this service) and `scripts/devpg.sh start` (no Docker) are interchangeable.
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eidolon
      POSTGRES_PASSWORD: eidolon
      POSTGRES_DB: eidolon
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - eidolon-pg:/var/lib/postgresql/data
      - ./deployments/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eidolon -d eidolon"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - eidolon-internal

  server:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.server
    # API stays internal to the compose network; only the web tier is published.
    expose:
      - "26881"
    environment:
      EIDOLON_API_HOST: 0.0.0.0
      EIDOLON_API_PORT: "26881"
      EIDOLON_DATABASE_URL: sqlite:///./data/eidolon.db
      EIDOLON_WORKSPACE_ROOT: ./data/workspaces
      EIDOLON_RUNTIME_MODE: mock
      EIDOLON_RUNTIME_CONTROL_MODE: docker
      EIDOLON_CORS_ORIGINS: http://localhost:26880
    volumes:
      - eidolon-data:/app/data
    networks:
      - eidolon-internal

  web:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.web
    ports:
      - "26880:26880"
    depends_on:
      - server
    networks:
      - eidolon-internal

networks:
  eidolon-internal:
    driver: bridge

volumes:
  eidolon-data:
  eidolon-pg:
