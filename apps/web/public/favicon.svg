<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Eidolon">
  <!-- 与 src/design/tokens.css 对齐：dark --background/--primary、light --background/--primary -->
  <style>
    .tile { fill: #01030f; }
    .orbit { fill: none; stroke: #57a8ff; stroke-width: 1.6; }
    .core { fill: #57a8ff; }
    @media (prefers-color-scheme: light) {
      .tile { fill: #f1f3f7; }
      .orbit { stroke: #1a6fe1; }
      .core { fill: #1a6fe1; }
    }
  </style>
  <rect class="tile" width="24" height="24" rx="5" />
  <g class="orbit">
    <path d="M20.341 6.484A10 10 0 0 1 10.266 21.85" />
    <path d="M3.659 17.516A10 10 0 0 1 13.74 2.152" />
    <circle cx="12" cy="12" r="3" />
  </g>
  <circle class="core" cx="19" cy="5" r="2" />
  <circle class="core" cx="5" cy="19" r="2" />
</svg>
