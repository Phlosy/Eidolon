[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-runner"
version = "0.1.0"
description = "Eidolon sandboxed tool runner: a separate process, JSON-RPC over stdio, no secrets"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
include = ["eidolon_runner*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
