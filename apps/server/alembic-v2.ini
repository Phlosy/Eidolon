# Alembic configuration for Eidolon v2 (apps/server/eidolon). The legacy app keeps
# alembic.ini + migrations/; v2 has its own chain and its own version table so the
# two can share a repository during the strangler period (v2-ADR-1).
[alembic]
script_location = eidolon/migrations
prepend_sys_path = .
path_separator = os
version_table = alembic_version_v2
file_template = %%(rev)s_%%(slug)s
# sqlalchemy.url is taken from EIDOLON_V2_DATABASE_URL in env.py

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
