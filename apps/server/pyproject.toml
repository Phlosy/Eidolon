[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-server"
version = "0.1.0"
description = "Eidolon — Autonomous AI Organization Runtime (backend)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy>=2.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "alembic>=1.13",
    "httpx>=0.27",
    "docker~=7.2",
    "cryptography>=42",
    "websockets>=12",
    "pyyaml>=6",
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "argon2-cffi>=25.1",
    "webauthn>=2.2",
    "email-validator>=2.2",
]

[project.optional-dependencies]
dev = [
    "pillow>=11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    # 格式化器版本会改变 `ruff format --check` 的判定，不 pin 就会让 CI 红绿灯不可复现。
    # 完整锁版本见 requirements.lock（CI 与 make install 都走它）。
    "ruff~=0.16.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI idiom: Depends() in argument defaults
"app/api/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: tests requiring a real Docker daemon (run via `make test-integration`)",
]
# Integration tests are excluded by default; `pytest -m integration` (CLI -m wins) runs them.
addopts = "-m 'not integration'"
