[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidolon-server"
version = "2.0.0"
description = "Eidolon v2 — an immutable ledger of AI labour, a boundary of who decides, a trail for every step"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.3",
    "alembic>=1.19",
    "pydantic>=2",
    "pydantic-settings>=2",
    "email-validator>=2.2",
    "argon2-cffi>=25.1",
    "httpx>=0.28",
    "anthropic>=2.6",
    "prometheus_client>=0.24",
    "cryptography>=42",
    "webauthn>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.4",
    # 格式化器版本会改变 `ruff format --check` 的判定，不 pin 就会让 CI 红绿灯不可复现。
    # 完整锁版本见 requirements.lock（CI 与 make install 都走它）。
    "ruff~=0.16.5",
]

[tool.setuptools.packages.find]
include = ["eidolon*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["eidolon/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI idiom: Depends() in argument defaults
"eidolon/api/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests_v2"]
asyncio_mode = "auto"
